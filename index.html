<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Weekly Time Blocking</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
html,body{
overscroll-behavior:contain;
touch-action:manipulation;
}
body{
font-family:Arial;
margin:20px;
}
h2{text-align:center;}
.instructions{
max-width:1000px;margin:0 auto 20px auto;padding:15px;
background:#f5f5f5;border-radius:8px;
}
#calendar{max-width:1100px;margin:0 auto;}
button{cursor:pointer;}
</style>
</head>

<body>

<h2>Weekly Time Blocking Activity</h2>

<div class="instructions">
Build your schedule and include exams, homework, studying, mentees, and social events.
</div>

<div style="text-align:center;margin-bottom:15px;">
<button id="addClassBtn">+ Add Class</button>
<button id="addEventBtn">+ Add Event</button>
</div>

<!-- CLASS MODAL -->
<div id="classModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;">
<div style="background:white;padding:20px;border-radius:10px;">
<input id="className" placeholder="Class Name"><br><br>

<label><input type="checkbox" value="1"> Mon</label>
<label><input type="checkbox" value="2"> Tue</label>
<label><input type="checkbox" value="3"> Wed</label>
<label><input type="checkbox" value="4"> Thu</label>
<label><input type="checkbox" value="5"> Fri</label><br><br>

<select id="startTime"></select><br><br>
<select id="endTime"></select><br><br>

<button onclick="submitClass()">Add</button>
<button onclick="closeModal()">Cancel</button>
</div>
</div>

<!-- EVENT MODAL -->
<div id="eventModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;">
<div style="background:white;padding:20px;border-radius:10px;">
<input id="eventTitle" placeholder="Event"><br><br>

<label><input type="checkbox" value="0"> Sun</label>
<label><input type="checkbox" value="1"> Mon</label>
<label><input type="checkbox" value="2"> Tue</label>
<label><input type="checkbox" value="3"> Wed</label>
<label><input type="checkbox" value="4"> Thu</label>
<label><input type="checkbox" value="5"> Fri</label>
<label><input type="checkbox" value="6"> Sat</label><br><br>

<input type="time" id="eventStart"><br><br>
<input type="time" id="eventEnd"><br><br>

<button onclick="submitEvent()">Add</button>
<button onclick="closeEventModal()">Cancel</button>
</div>
</div>

<div id="calendar"></div>

<script>

const startTimes=["07:25","08:30","09:35","10:40","11:45","12:50","13:55","15:00","16:05","17:10","18:15","19:20","20:20","21:20"];
const endTimes=["08:15","09:20","10:25","11:30","12:35","13:40","14:45","15:50","16:55","18:00","19:05","20:10","21:10","22:10"];

function fillSelect(el,times){
el.innerHTML="";
times.forEach(t=>{
let o=document.createElement("option");
o.value=t+":00";
o.text=t;
el.appendChild(o);
});
}

function overlapsExam(start,end){
return calendar.getEvents().some(e=>{
if(!e.extendedProps.isExam) return false;
return start<e.end && end>e.start;
});
}

function resetForm(id){
document.querySelectorAll(`#${id} input`).forEach(i=>{
if(i.type==="checkbox") i.checked=false;
else i.value="";
});
}

document.addEventListener('DOMContentLoaded',()=>{

fillSelect(startTime,startTimes);
fillSelect(endTime,endTimes);

window.calendar=new FullCalendar.Calendar(calendar,{

initialView:'timeGridWeek',
initialDate:'2026-03-29',
selectable:true,
editable:true,

events:[
{
title:'Exam 1',
start:'2026-04-01T20:30:00',
end:'2026-04-01T22:30:00',
backgroundColor:'red',
editable:false,
startEditable:false,
durationEditable:false,
resourceEditable:false,
extendedProps:{isExam:true}
},
{
title:'Exam 2',
start:'2026-04-03T11:30:00',
end:'2026-04-03T13:30:00',
backgroundColor:'red',
editable:false,
startEditable:false,
durationEditable:false,
resourceEditable:false,
extendedProps:{isExam:true}
}
],

select(info){
if(overlapsExam(info.start,info.end)) return;

let title=prompt("Event?");
if(title){
calendar.addEvent({title,start:info.start,end:info.end});
}
},

eventClick(info){
if(info.event.extendedProps.isExam) return;
if(confirm("Delete?")) info.event.remove();
}

});

calendar.render();
});

addClassBtn.onclick=()=>classModal.style.display="flex";
addEventBtn.onclick=()=>eventModal.style.display="flex";

function closeModal(){classModal.style.display="none";}
function closeEventModal(){eventModal.style.display="none";}

function submitClass(){
let name=className.value;
let days=document.querySelectorAll('#classModal input:checked');

days.forEach(d=>{
let base=new Date('2026-03-29');
base.setDate(base.getDate()+parseInt(d.value));
let date=base.toISOString().split('T')[0];

calendar.addEvent({
title:name,
start:date+"T"+startTime.value,
end:date+"T"+endTime.value
});
});

resetForm("classModal");
closeModal();
}

function submitEvent(){
let title=eventTitle.value;
let days=document.querySelectorAll('#eventModal input:checked');

days.forEach(d=>{
let base=new Date('2026-03-29');
base.setDate(base.getDate()+parseInt(d.value));
let date=base.toISOString().split('T')[0];

let s=new Date(date+"T"+eventStart.value);
let e=new Date(date+"T"+eventEnd.value);

if(overlapsExam(s,e)) return;

calendar.addEvent({title,start:s,end:e});
});

resetForm("eventModal");
closeEventModal();
}

</script>

</body>
</html>
